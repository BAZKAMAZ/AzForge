<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzForge — Документация</title>
<meta name="description" content="Документация моддинг-платформы AzForge для Azangara: гайды и справочник API — 32 подсистемы, 750 функций, C-интерфейс.">
<meta name="theme-color" content="#0e1117">
<link rel="icon" href="../../res/AFhammer.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/docs.css">
</head>
<body data-theme="dark" data-title-key="meta.docs.title">

<div class="bg-grid" aria-hidden="true"></div>

<header class="topbar">
  <div class="wrap top-in">
    <button class="iconbtn burger" id="burger" aria-label="Меню">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="brand" href="#/overview">
      <img src="../../res/AFhammer.svg" alt="AzForge">
      AzForge
    </a>
    <nav class="topnav" id="topnav">
      <a href="#/overview" data-nav="overview">Обзор</a>
      <a href="#/quickstart" data-nav="quickstart">Быстрый старт</a>
      <a href="#/package" data-nav="package">Мод-пакет</a>
      <a href="#/apimodel" data-nav="apimodel">Модель API</a>
      <a href="#/reference" data-nav="reference">Справочник</a>
    </nav>
    <div class="topbar-right">
      <button class="searchbtn" id="searchBtn" title="Поиск (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Поиск…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="iconbtn" id="themeBtn" title="Тема">
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <!-- droplist языка — самый правый элемент топбара -->
      <div data-lang-switch></div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll" id="sidebarContent"><!-- renders js/app.js --></div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="content" id="content"><!-- renders js/app.js --></main>
</div>

<footer class="foot">
  <div class="foot-in">
    <span>AzForge <b id="footVer"></b> · mod API <b id="footApi"></b></span>
  </div>
</footer>

<!-- поиск -->
<div class="modal-wrap" id="searchModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Поиск по документации">
    <div class="modal-input-row">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Функция, тип, константа…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="modal-results" id="searchResults"></div>
    <div class="modal-hint"><span>↑↓ — выбор</span><span>Enter — перейти</span><span id="searchCount"></span></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/desc-ru-1.js"></script>
<script src="js/desc-ru-2.js"></script>
<script src="js/desc-ru-3.js"></script>
<script src="js/desc-en-1.js"></script>
<script src="js/desc-en-2.js"></script>
<script src="js/desc-en-3.js"></script>
<script src="../js/lang/ru.js"></script>
<script src="../js/lang/en.js"></script>
<script src="../js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/ref.js"></script>
<script src="js/guides.js"></script>
<script src="js/app.js"></script>
</body>
</html>
